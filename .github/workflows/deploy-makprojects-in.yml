name: Deploy to makprojects.in

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-makprojects-in
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm run build
      - name: Deploy dist to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 147.93.99.94
          username: u364394781.makprojects.in
          password: ${{ secrets.HOSTINGER_FTP_PASS }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
